<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3G Flora - Feedback & Enquiry</title>
    <style>
        :root { --primary: #d4a373; --secondary: #b76e79; --text-dark: #5d4037; --bg-light: #fff8f0; }
        body { font-family: 'Georgia', serif; text-align: center; background-color: var(--bg-light); padding: 15px; color: var(--text-dark); margin: 0; }
        .container { max-width: 450px; margin: 10px auto; background: rgba(255, 255, 255, 0.98); padding: 25px 20px; border-radius: 30px; border: 4px solid var(--primary); box-shadow: 0 15px 40px rgba(183, 110, 121, 0.2); }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 10px; background: #fff; padding: 5px; }
        
        /* Italic Brand Logo */
        .brand-logo { font-size: 32px; font-weight: bold; font-style: italic; color: var(--secondary); margin-bottom: 20px; }
        
        /* Instagram Button */
        .ig-follow { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(45deg, #E1306C, #f77737, var(--primary)); color: white; padding: 12px 20px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 20px; width: 85%; transition: 0.2s; }
        
        /* Click Animation for Button */
        @keyframes bounceClick {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .anim-bounce { animation: bounceClick 0.3s ease-in-out; }

        input, textarea, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin: 8px 0 15px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        label { display: block; text-align: left; font-weight: bold; font-size: 13px; color: #6d4c41; margin-left: 5px; }
        .stars { display: flex; justify-content: center; font-size: 40px; color: #e0e0e0; cursor: pointer; margin: 10px 0; }
        .star.active { color: var(--primary); text-shadow: 0 0 10px rgba(212, 163, 115, 0.3); }
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .chip { background: #fffaf0; padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid #fce4ec; transition: 0.2s; }
        .chip:hover { background: #fce4ec; }
        .wa-btn { background: #25D366; color: white; border: none; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; transition: 0.2s; }
        .wa-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.postimg.cc/cZJsYWrb/filelogo.png" alt="3G Flora Logo" class="logo-img">
    <div class="brand-logo">3G Flora</div>

    <a href="https://www.instagram.com/3g_flora?igsh=MXFnNXZkMnk2a2Juag==" target="_blank" class="ig-follow" onclick="handleFollowClick(this)">
        📷 Follow us on Instagram
    </a>

    <form id="mainForm">
        <label>Your Name *</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        
        <label>Mobile / Instagram ID (Optional)</label>
        <input type="text" id="contact" placeholder="How can we reach you?">

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div style="font-weight:bold; color:var(--secondary); font-size:18px;">SHARE FEEDBACK</div>
        <div class="stars" id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        <div class="chip-container" id="suggestionList"></div>
        <textarea id="feedbackText" placeholder="Tell us more about your order or what you think of our collection..."></textarea>
        
        <button type="button" onclick="playClickSound(); sendFeedbackWA();" class="wa-btn">
            💬 Send Feedback via WhatsApp
        </button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

        <div style="font-weight:bold; color:var(--secondary); font-size:18px; margin-bottom:15px;">NEW ORDER ENQUIRY</div>
        <label>Select Product *</label>
        <select id="enquiryProduct">
            <option value="None">-- Select a Product --</option>
            <option value="Jewellery">Jewellery</option>
            <option value="Photo Frame">Photo Frame</option>
            <option value="Clock">Clock</option>
            <option value="Preservation">Preservation</option>
            <option value="Return Gift">Return Gift</option>
            <option value="Name Plate">Name Plate</option>
            <option value="Other Customisation">Other Customisation</option>
        </select>

        <label>Specific Requirements & Budget</label>
        <textarea id="enquiryDetails" placeholder="Colors, budget, or other details..."></textarea>

        <button type="button" onclick="playClickSound(); sendEnquiryWA();" class="wa-btn">
            💬 Send Enquiry via WhatsApp
        </button>
    </form>
</div>

<script>
    // YOUR WHATSAPP NUMBER
    const myWhatsAppNumber = "917083642528"; 

    // --- NEW: Sound & Animation Logic ---
    function playClickSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.type = 'sine'; // Smooth beep sound
            osc.frequency.setValueAtTime(800, ctx.currentTime); // Pitch drop
            osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {
            console.log("Audio not supported");
        }
    }

    function handleFollowClick(element) {
        playClickSound();
        element.classList.add('anim-bounce');
        // Remove the animation class after it finishes so it can run again next time
        setTimeout(() => element.classList.remove('anim-bounce'), 300);
    }
    // -------------------------------------

    let selectedRating = 0;

    const suggestions = {
        "1": ["Damaged / Poor finish", "Late delivery", "Too expensive", "Didn't find what I wanted"],
        "2": ["More bubbles than expected", "Color mismatch", "Need better product photos", "Limited variety"],
        "3": ["Decent finish", "Okay packaging", "Need more custom options", "Fair pricing"],
        "4": ["Good quality product", "Beautiful, minor delay", "Great designs", "Nice variety"],
        "5": ["Exquisite quality & finish!", "Perfect packaging!", "Stunning art collection!", "Highly recommend!"]
    };

    document.querySelectorAll('.star').forEach(star => {
        star.onclick = () => {
            playClickSound(); // Added a subtle click sound to stars as well!
            selectedRating = star.dataset.value;
            document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < selectedRating));
            
            const list = document.getElementById('suggestionList');
            list.innerHTML = '';
            
            const hints = suggestions[selectedRating] || [];
            
            hints.forEach(h => {
                const c = document.createElement('div'); 
                c.className = 'chip'; 
                c.innerText = h;
                c.onclick = () => {
                    playClickSound();
                    document.getElementById('feedbackText').value = h;
                };
                list.appendChild(c);
            });
        };
    });

    function sendFeedbackWA() {
        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value || "Not provided";
        const feedback = document.getElementById('feedbackText').value || "No additional comments";

        if(!name) { alert("Please enter your Name."); return; }
        if(selectedRating === 0) { alert("Please select a star rating."); return; }

        const message = `*3G Flora - New Feedback* 🌸%0A%0A` +
                        `*Name:* ${name}%0A` +
                        `*Contact:* ${contact}%0A` +
                        `*Rating:* ${selectedRating} Stars ⭐%0A` +
                        `*Feedback:* ${feedback}`;

        const waURL = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(waURL, '_blank');
        
        setTimeout(() => {
            selectedRating = 0;
            document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
            document.getElementById('suggestionList').innerHTML = '';
            document.getElementById('feedbackText').value = '';
        }, 1000);
    }

    function sendEnquiryWA() {
        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value || "Not provided";
        const product = document.getElementById('enquiryProduct').value;
        const details = document.getElementById('enquiryDetails').value || "No specific details";

        if(!name) { alert("Please enter your Name."); return; }
        if(product === "None") { alert("Please select a product."); return; }

        const message = `*3G Flora - New Enquiry* 🛍️%0A%0A` +
                        `*Name:* ${name}%0A` +
                        `*Contact:* ${contact}%0A` +
                        `*Product:* ${product}%0A` +
                        `*Details:* ${details}`;

        const waURL = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(waURL, '_blank');
    }
</script>

</body>
</html>
