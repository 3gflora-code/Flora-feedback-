<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3G Flora - Feedback</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            text-align: center; 
            background-color: #fff8f0;
            background-image: linear-gradient(rgba(255,248,240,0.9), rgba(255,248,240,0.9)),
                              url('https://www.transparenttextures.com/patterns/flowers.png');
            background-size: cover, 300px;
            padding: 20px; 
            color: #5d4037; 
            margin: 0;
            min-height: 100vh;
        }
        
        .container { 
            max-width: 440px; 
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.97); 
            padding: 35px 25px; 
            border-radius: 35px; 
            border: 4px solid #d4a373;
            box-shadow: 0 20px 50px rgba(183, 110, 121, 0.3); 
        }
        
        .logo-img { 
            width: 215px; 
            height: 215px; 
            border-radius: 50%; 
            margin: 10px auto 15px; 
            border: 7px solid #d4a373;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
            object-fit: contain;
            display: block;
            background: white;
            padding: 12px;
        }

        .brand-logo { 
            font-size: 34px; 
            font-weight: bold; 
            color: #b76e79; 
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .brand-tagline { 
            font-size: 15.5px; 
            font-style: italic; 
            color: #8d6e63; 
            margin-bottom: 25px;
        }
        
        .ig-follow { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(45deg, #E1306C, #f77737, #d4a373);
            color: white; 
            padding: 15px 30px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 16.5px;
            margin: 20px auto 30px;
            width: 88%;
            box-shadow: 0 6px 20px rgba(225, 48, 108, 0.35);
        }

        .stars { 
            font-size: 52px; 
            cursor: pointer; 
            color: #e0e0e0; 
            margin: 20px 0 15px; 
            letter-spacing: 6px;
        }
        
        .stars span.active { 
            color: #d4a373; 
            text-shadow: 0 0 15px rgba(212, 163, 115, 0.7);
        }
        
        #ai-section { 
            display: none; 
            margin-top: 15px; 
            text-align: left; 
            animation: fadeIn 0.8s; 
        }
        
        .status-msg { 
            font-size: 16.5px; 
            margin-bottom: 15px; 
            color: #b76e79; 
            font-weight: bold; 
            text-align: center; 
        }
        
        .chip { 
            background: #fffaf0; 
            padding: 13px 15px; 
            border-radius: 18px; 
            margin: 8px 0; 
            font-size: 14px; 
            cursor: pointer; 
            border: 1px solid #fce4ec;
            color: #5d4037;
            transition: all 0.3s;
        }
        
        input[type="text"], textarea { 
            width: 100%; 
            padding: 14px; 
            border-radius: 15px; 
            border: 2px solid #d4a373; 
            margin: 8px 0;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        textarea { height: 105px; resize: vertical; }
        
        .submit-btn { 
            background: #5d4037; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 50px; 
            margin-top: 20px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.postimg.cc/cZJsYWrb/filelogo.png" 
         alt="3G Flora Logo" 
         class="logo-img"
         onerror="this.src='https://via.placeholder.com/215x215/fffaf0/d4a373?text=3G+Flora';">

    <div class="brand-logo">3G Flora</div>
    <div class="brand-tagline">Preserving Nature in Art</div>

    <a href="https://www.instagram.com/3g_flora?igsh=MXFnNXZkMnk2a2Juag==" 
       target="_blank" 
       class="ig-follow">
        📷 Follow us on Instagram
    </a>

    <input type="text" id="username-input" placeholder="Your Name *">
    <input type="text" id="contact-input" placeholder="Mobile Number or Instagram ID">

    <div style="font-size: 17px; margin: 25px 0 8px; font-weight: bold; color: #6d4c41;">
        How was your experience with our resin art?
    </div>
    
    <div class="stars" id="star-rating">
        <span onclick="updateRating(1)">★</span>
        <span onclick="updateRating(2)">★</span>
        <span onclick="updateRating(3)">★</span>
        <span onclick="updateRating(4)">★</span>
        <span onclick="updateRating(5)">★</span>
    </div>

    <div id="ai-section">
        <p class="status-msg" id="msg-text"></p>
        <div id="suggestion-list"></div>
        <textarea id="review-input" placeholder="Share your thoughts..."></textarea>
        <button class="submit-btn" onclick="submitFeedback()">Submit Feedback</button>
    </div>
</div>

<script>
    let currentRating = 0;

    const reviews = {
        low: ["The piece had more bubbles in the resin than expected.", "Pickup/Delivery timing could be improved.", "The product colors looked different than the online photos."],
        neutral: ["Beautiful piece but could be improved in finishing.", "Loved the concept! Delivery was smooth."],
        high: ["Stunning botanical preservation! Truly a unique piece of art.", "The rose gold details and flowers are beautiful. Highly recommend!", "Exquisite quality and the packaging made it feel so special."]
    };

    function updateRating(n) {
        currentRating = n;
        const stars = document.querySelectorAll('.stars span');
        stars.forEach((s, i) => s.classList.toggle('active', i < n));
        
        document.getElementById('ai-section').style.display = 'block';
        const list = document.getElementById('suggestion-list');
        const msg = document.getElementById('msg-text');
        list.innerHTML = '';

        if (n <= 2) {
            msg.innerText = "We're sorry to hear that! How can we improve?";
            reviews.low.forEach(t => addChip(t));
        } else if (n === 3 || n === 4) {
            msg.innerText = "Thank you! Any specific thoughts?";
            reviews.neutral.forEach(t => addChip(t));
        } else if (n === 5) {
            msg.innerText = "We're delighted! Choose a review to share:";
            reviews.high.forEach(t => addChip(t));
        }
    }

    function addChip(text) {
        const div = document.createElement('div');
        div.className = 'chip';
        div.innerText = text;
        div.onclick = () => document.getElementById('review-input').value = text;
        document.getElementById('suggestion-list').appendChild(div);
    }

    async function submitFeedback() {
        const name = document.getElementById('username-input').value.trim();
        const contact = document.getElementById('contact-input').value.trim();
        const reviewText = document.getElementById('review-input').value.trim();
        const rating = currentRating;

        if (!name) {
            alert("Please enter your Name.");
            return;
        }
        if (rating === 0) {
            alert("Please select a star rating.");
            return;
        }
        if (!reviewText) {
            alert("Please share your thoughts or select a suggestion.");
            return;
        }

        // === CHANGE THIS LINE WITH YOUR GOOGLE WEB APP URL ===
        const scriptURL = "https://script.google.com/macros/s/YOUR_WEB_APP_URL/exec";

        const formData = new FormData();
        formData.append("Timestamp", new Date().toLocaleString('en-IN'));
        formData.append("Name", name);
        formData.append("Contact", contact || "");
        formData.append("Rating", rating);
        formData.append("Feedback", reviewText);

        try {
            const response = await fetch(scriptURL, { 
                method: 'POST', 
                body: formData 
            });
            console.log("Data sent to Google Sheet");
        } catch (e) {
            console.error("Failed to save:", e);
        }

        alert(`Thank you ${name}! 🌸\n\nYour feedback has been saved successfully.`);

        // Reset everything after submission
        document.getElementById('review-input').value = '';
        document.getElementById('username-input').value = '';
        document.getElementById('contact-input').value = '';
        
        currentRating = 0;
        const stars = document.querySelectorAll('.stars span');
        stars.forEach(s => s.classList.remove('active'));
        
        document.getElementById('ai-section').style.display = 'none';
    }
</script>

</body>
</html>
