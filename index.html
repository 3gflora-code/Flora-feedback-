<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3G Flora - Connect With Us</title>

<style>
:root {
    --primary: #d4a373;
    --secondary: #b76e79;
    --text-dark: #5d4037;
    --bg-light: #fff8f0;
}

body {
    font-family: 'Georgia', serif;
    text-align: center;
    background-color: var(--bg-light);
    padding: 20px;
    color: var(--text-dark);
}

.container {
    max-width: 440px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 25px;
    border: 3px solid var(--primary);
}

.logo-img {
    width: 120px;
    border-radius: 50%;
    border: 4px solid var(--primary);
}

.brand-logo {
    font-size: 26px;
    font-weight: bold;
    color: var(--secondary);
}

.type-selector {
    width: 100%;
    padding: 12px;
    border-radius: 20px;
    margin: 15px 0;
}

.form-section {
    display: none;
    text-align: left;
}

input, textarea, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

label {
    font-weight: bold;
}

.stars {
    font-size: 30px;
    text-align: center;
    cursor: pointer;
}

.star.active {
    color: gold;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 25px;
    background: var(--text-dark);
    color: white;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<img src="https://i.postimg.cc/cZJsYWrb/filelogo.png" class="logo-img">
<div class="brand-logo">3G Flora</div>

<select id="formType" class="type-selector" onchange="toggleForm()">
    <option value="">-- Choose Option --</option>
    <option value="enquiry">New Order Enquiry</option>
    <option value="feedback">Share Feedback</option>
</select>

<form id="masterForm">

<div id="common-fields" style="display:none;">
<label>Full Name *</label>
<input type="text" id="name" required>

<label>Mobile / Instagram ID *</label>
<input type="text" id="contact" required>
</div>

<!-- Enquiry -->
<div id="enquiry-section" class="form-section">
<label>Product</label>
<select id="productName">
<option>Keychain</option>
<option>Photo Frame</option>
<option>Varmala Preservation</option>
</select>

<label>Requirements</label>
<textarea id="requirements"></textarea>

<label>Budget</label>
<input type="number" id="budget">

<label>Delivery Date</label>
<input type="date" id="deliveryDate">
</div>

<!-- Feedback -->
<div id="feedback-section" class="form-section">
<label style="text-align:center;display:block;">Rate:</label>

<div class="stars">
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>
</div>

<textarea id="feedbackText" placeholder="Write feedback..."></textarea>
</div>

<button type="submit" id="submitBtn" class="submit-btn" style="display:none;">Submit</button>

</form>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbz8xO_ucuKjITosMVE62XvjnxqofwLyA7mfNEQOiqQd7BPPtU-HRSOzRDPJp-SCIGxEPQ/exec";let currentRating = 0;

// Toggle form
function toggleForm(){
    let type = document.getElementById("formType").value;

    document.getElementById("common-fields").style.display = type ? "block" : "none";
    document.getElementById("enquiry-section").style.display = type === "enquiry" ? "block" : "none";
    document.getElementById("feedback-section").style.display = type === "feedback" ? "block" : "none";
    document.getElementById("submitBtn").style.display = type ? "block" : "none";
}

// Star rating
document.querySelectorAll(".star").forEach(star => {
    star.onclick = () => {
        currentRating = star.dataset.value;

        document.querySelectorAll(".star").forEach((s, i) => {
            s.classList.toggle("active", i < currentRating);
        });
    };
});

// Submit
document.getElementById("masterForm").addEventListener("submit", function(e){
    e.preventDefault();

    let type = document.getElementById("formType").value;

    // Validation
    if(type === "feedback" && currentRating == 0){
        alert("Please select rating ⭐");
        return;
    }

    let formData = new FormData();

    formData.append("Type", type);
    formData.append("Name", document.getElementById("name").value);
    formData.append("Contact", document.getElementById("contact").value);

    if(type === "enquiry"){
        formData.append("Product", document.getElementById("productName").value);
        formData.append("Requirements", document.getElementById("requirements").value);
        formData.append("Budget", document.getElementById("budget").value);
        formData.append("Date", document.getElementById("deliveryDate").value);
    } else {
        formData.append("Rating", currentRating);
        formData.append("Feedback", document.getElementById("feedbackText").value);
    }

    fetch(scriptURL, {
        method: "POST",
        body: formData
    })
    .then(() => {
        alert("Submitted Successfully 🌸");
        location.reload();
    })
    .catch(() => {
        alert("Error submitting form");
    });
});
</script>

</body>
</html>
