<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3G Flora - Feedback & WhatsApp Enquiry</title>
    <style>
        :root { --primary: #d4a373; --secondary: #b76e79; --text-dark: #5d4037; --bg-light: #fff8f0; }
        body { font-family: 'Georgia', serif; text-align: center; background-color: var(--bg-light); padding: 15px; color: var(--text-dark); margin: 0; }
        .container { max-width: 450px; margin: 10px auto; background: rgba(255, 255, 255, 0.98); padding: 25px 20px; border-radius: 30px; border: 4px solid var(--primary); box-shadow: 0 15px 40px rgba(183, 110, 121, 0.2); }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 10px; background: #fff; padding: 5px; }
        .brand-logo { font-size: 28px; font-weight: bold; color: var(--secondary); margin-bottom: 20px; }
        .ig-follow { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(45deg, #E1306C, #f77737, var(--primary)); color: white; padding: 12px 20px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 20px; width: 85%; }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin: 8px 0 15px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        label { display: block; text-align: left; font-weight: bold; font-size: 13px; color: #6d4c41; margin-left: 5px; }
        .stars { display: flex; justify-content: center; font-size: 40px; color: #e0e0e0; cursor: pointer; margin: 10px 0; }
        .star.active { color: var(--primary); text-shadow: 0 0 10px rgba(212, 163, 115, 0.3); }
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .chip { background: #fffaf0; padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid #fce4ec; }
        .submit-btn { background: var(--text-dark); color: white; border: none; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; margin: 10px 0; }
        .wa-btn { background: #25D366; color: white; border: none; padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.postimg.cc/cZJsYWrb/filelogo.png" alt="3G Flora Logo" class="logo-img">
    <div class="brand-logo">3G Flora</div>

    <a href="https://www.instagram.com/3g_flora?igsh=MXFnNXZkMnk2a2Juag==" target="_blank" class="ig-follow">
        📷 Follow us on Instagram
    </a>

    <form id="mainForm">
        <label>Your Name *</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        
        <label>Mobile / Instagram ID *</label>
        <input type="text" id="contact" placeholder="How can we reach you?" required>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div style="font-weight:bold; color:var(--secondary); font-size:18px;">SHARE FEEDBACK</div>
        <div class="stars" id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        <div class="chip-container" id="suggestionList"></div>
        <textarea id="feedbackText" placeholder="Your experience helps us grow..."></textarea>
        <button type="button" onclick="sendFeedback()" class="submit-btn" id="feedbackBtn">Submit Feedback</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

        <div style="font-weight:bold; color:var(--secondary); font-size:18px; margin-bottom:15px;">NEW ORDER ENQUIRY</div>
        <label>Select Product *</label>
        <select id="enquiryProduct">
            <option value="None">-- Select a Product --</option>
            <option value="Jewellery">Jewellery</option>
            <option value="Photo Frame">Photo Frame</option>
            <option value="Clock">Clock</option>
            <option value="Preservation">Preservation</option>
            <option value="Return Gift">Return Gift</option>
            <option value="Name Plate">Name Plate</option>
            <option value="Other Customisation">Other Customisation</option>
        </select>

        <label>Specific Requirements & Budget</label>
        <textarea id="enquiryDetails" placeholder="Colors, budget, or other details..."></textarea>

        <button type="button" onclick="sendWhatsApp()" class="wa-btn">
            💬 Send Enquiry via WhatsApp
        </button>
    </form>
</div>

<script>
    // 1. YOUR EXACT GOOGLE SCRIPT URL
    const scriptURL = "https://script.google.com/macros/s/AKfycbz8xO_ucuKjITosMVE62XvjnxqofwLyA7mfNEQOiqQd7BPPtU-HRSOzRDPJp-SCIGxEPQ/exec";
    
    // 2. PUT YOUR WHATSAPP NUMBER HERE (Keep the 91, replace the X's)
    const myWhatsAppNumber = "7083642528"; 

    let selectedRating = 0;

    // Star Logic & Chips
    document.querySelectorAll('.star').forEach(star => {
        star.onclick = () => {
            selectedRating = star.dataset.value;
            document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < selectedRating));
            
            const list = document.getElementById('suggestionList');
            list.innerHTML = '';
            const hints = selectedRating > 3 
                ? ["Love the art!", "Perfect finish", "Exquisite quality"] 
                : ["Late delivery", "More bubbles than expected", "Color mismatch"];
            
            hints.forEach(h => {
                const c = document.createElement('div'); c.className='chip'; c.innerText=h;
                c.onclick = () => document.getElementById('feedbackText').value = h;
                list.appendChild(c);
            });
        };
    });

    function sendFeedback() {
        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value;
        const btn = document.getElementById('feedbackBtn');

        if(!name || !contact) { alert("Please enter your Name & Contact details."); return; }
        if(selectedRating === 0) { alert("Please select a star rating."); return; }
        
        btn.disabled = true;
        btn.innerText = "Saving...";

        const formData = new FormData();
        formData.append("FormType", "Feedback");
        formData.append("Timestamp", new Date().toLocaleString());
        formData.append("Name", name);
        formData.append("Contact", contact);
        formData.append("Rating", selectedRating);
        formData.append("Feedback", document.getElementById('feedbackText').value);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(() => {
                alert("Feedback Saved! Thank you. 🌸");
                btn.disabled = false;
                btn.innerText = "Submit Feedback";
                // Clear the feedback fields
                selectedRating = 0;
                document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                document.getElementById('suggestionList').innerHTML = '';
                document.getElementById('feedbackText').value = '';
            })
            .catch(() => {
                alert("Error saving feedback. Please try again.");
                btn.disabled = false;
                btn.innerText = "Submit Feedback";
            });
    }

    function sendWhatsApp() {
        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value;
        const product = document.getElementById('enquiryProduct').value;
        const details = document.getElementById('enquiryDetails').value;

        if(!name || !contact) { alert("Please enter your Name & Contact details."); return; }
        if(product === "None") { alert("Please select a product."); return; }

        // Save enquiry to Google Sheets silently in the background
        const formData = new FormData();
        formData.append("FormType", "Enquiry");
        formData.append("Timestamp", new Date().toLocaleString());
        formData.append("Name", name);
        formData.append("Contact", contact);
        formData.append("Product", product);
        formData.append("Requirements", details);
        fetch(scriptURL, { method: 'POST', body: formData });

        // Construct and open WhatsApp
        const message = `*3G Flora - New Enquiry*%0A%0A` +
                        `*Name:* ${name}%0A` +
                        `*Contact:* ${contact}%0A` +
                        `*Product:* ${product}%0A` +
                        `*Details:* ${details}`;

        const waURL = `https://wa.me/${myWhatsAppNumber}?text=${message}`;
        window.open(waURL, '_blank');
    }
</script>

</body>
</html>
