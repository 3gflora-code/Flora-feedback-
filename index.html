<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3G Flora - Feedback</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            text-align: center; 
            background-color: #fff5f8;
            background-image: url('https://www.transparenttextures.com/patterns/cream-pixels.png');
            padding: 20px; 
            color: #5d4037; 
            margin: 0;
        }
        
        .container { 
            max-width: 420px; 
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.97); 
            padding: 35px 25px; 
            border-radius: 30px; 
            border: 3px solid #d4a373;
            box-shadow: 0 15px 40px rgba(183, 110, 121, 0.25); 
        }
        
        .logo-img { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            margin-bottom: 15px; 
            border: 4px solid #d4a373;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            object-fit: cover;
        }

        .brand-logo { 
            font-size: 32px; 
            font-weight: bold; 
            color: #b76e79; 
            margin-bottom: 5px; 
            letter-spacing: 1.5px;
        }
        
        .brand-tagline { 
            font-size: 15px; 
            font-style: italic; 
            color: #8d6e63; 
            margin-bottom: 25px;
        }
        
        /* Instagram Button */
        .ig-follow { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(45deg, #E1306C, #f77737, #d4a373);
            color: white; 
            padding: 14px 28px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 16px;
            margin: 20px auto 30px;
            width: 85%;
            box-shadow: 0 6px 20px rgba(225, 48, 108, 0.3);
            transition: all 0.3s ease;
        }

        .ig-follow:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(225, 48, 108, 0.4);
        }

        .stars { 
            font-size: 48px; 
            cursor: pointer; 
            color: #e0e0e0; 
            margin: 20px 0; 
            transition: 0.3s; 
            letter-spacing: 4px;
        }
        
        .stars span.active { 
            color: #d4a373; 
            text-shadow: 0 0 12px rgba(212, 163, 115, 0.6);
        }
        
        #ai-section { 
            display: none; 
            margin-top: 25px; 
            text-align: left; 
            animation: fadeIn 0.8s; 
        }
        
        .status-msg { 
            font-size: 16px; 
            margin-bottom: 15px; 
            color: #b76e79; 
            font-weight: bold; 
            text-align: center; 
        }
        
        .chip { 
            background: #fffafa; 
            padding: 14px 16px; 
            border-radius: 18px; 
            margin: 10px 0; 
            font-size: 14px; 
            cursor: pointer; 
            border: 1px solid #fce4ec;
            color: #5d4037;
            transition: all 0.3s;
            line-height: 1.4;
        }
        
        .chip:hover { 
            background: #fce4ec; 
            border-color: #d4a373; 
            transform: translateX(5px);
        }
        
        textarea { 
            width: 100%; 
            height: 110px; 
            border-radius: 18px; 
            border: 2px solid #d4a373; 
            padding: 15px; 
            box-sizing: border-box; 
            margin-top: 15px;
            background: #fffcfc;
            font-family: inherit;
            resize: vertical;
        }
        
        .submit-btn { 
            background: #5d4037; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 50px; 
            margin-top: 25px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #3e2a24;
            transform: translateY(-2px);
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.jpg" alt="3G Flora Logo" class="logo-img" onerror="this.style.display='none'">
    
    <div class="brand-logo">3G Flora</div>
    <div class="brand-tagline">Preserving Nature in Art</div>

    <!-- Your Instagram Link Added Here -->
    <a href="https://www.instagram.com/3g_flora?igsh=MXFnNXZkMnk2a2Juag==" 
       target="_blank" 
       class="ig-follow">
        📷 Follow us on Instagram
    </a>

    <div style="font-size: 17px; margin: 15px 0 10px; font-weight: bold; color: #6d4c41;">
        How was your experience?
    </div>
    
    <div class="stars" id="star-rating">
        <span onclick="updateRating(1)">★</span>
        <span onclick="updateRating(2)">★</span>
        <span onclick="updateRating(3)">★</span>
        <span onclick="updateRating(4)">★</span>
        <span onclick="updateRating(5)">★</span>
    </div>

    <div id="ai-section">
        <p class="status-msg" id="msg-text"></p>
        <div id="suggestion-list"></div>
        <textarea id="review-input" placeholder="Share your thoughts here..."></textarea>
        <button class="submit-btn" onclick="submitFeedback()">Submit Feedback</button>
    </div>
</div>

<script>
    const reviews = {
        1: [
            "The piece had more bubbles in the resin than expected.",
            "Pickup/Delivery timing could be improved.",
            "The product colors looked different than the online photos."
        ],
        5: [
            "Stunning botanical preservation! Truly a unique piece of art.",
            "The rose gold details and flowers are beautiful. Highly recommend!",
            "Exquisite quality and the packaging made it feel so special."
        ]
    };

    function updateRating(n) {
        const stars = document.querySelectorAll('.stars span');
        stars.forEach((s, i) => s.classList.toggle('active', i < n));
        
        document.getElementById('ai-section').style.display = 'block';
        const list = document.getElementById('suggestion-list');
        const msg = document.getElementById('msg-text');
        list.innerHTML = '';

        if (n <= 2) {
            msg.innerText = "We're sorry to hear that! How can we improve?";
            reviews[1].forEach(text => addChip(text));
        } else if (n === 5) {
            msg.innerText = "We're delighted! Choose a review to share:";
            reviews[5].forEach(text => addChip(text));
        } else {
            msg.innerText = "Thank you for your feedback! We truly appreciate it.";
        }
    }

    function addChip(text) {
        const div = document.createElement('div');
        div.className = 'chip';
        div.innerText = text;
        div.onclick = () => document.getElementById('review-input').value = text;
        document.getElementById('suggestion-list').appendChild(div);
    }

    function submitFeedback() {
        const reviewText = document.getElementById('review-input').value.trim();
        if (reviewText) {
            alert("Thank you for your valuable feedback! 🌸\n\nWe appreciate your support for 3G Flora.");
        } else {
            alert("Please share your thoughts before submitting.");
        }
    }
</script>

</body>
</html>
