<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3G Flora - Feedback & Enquiry</title>
    <style>
        :root {
            --primary: #d4a373;
            --secondary: #b76e79;
            --text-dark: #5d4037;
            --bg-light: #fff8f0;
        }

        body { 
            font-family: 'Georgia', serif; 
            text-align: center; 
            background-color: var(--bg-light);
            background-image: linear-gradient(rgba(255,248,240,0.9), rgba(255,248,240,0.9)),
                              url('https://www.transparenttextures.com/patterns/flowers.png');
            background-size: cover, 300px;
            padding: 15px; 
            color: var(--text-dark); 
            margin: 0;
        }
        
        .container { 
            max-width: 450px; 
            margin: 10px auto;
            background: rgba(255, 255, 255, 0.98); 
            padding: 25px 20px; 
            border-radius: 30px; 
            border: 4px solid var(--primary);
            box-shadow: 0 15px 40px rgba(183, 110, 121, 0.2); 
        }
        
        .logo-img { width: 130px; height: 130px; border-radius: 50%; border: 5px solid var(--primary); background: white; padding: 5px; margin-bottom: 10px; }
        .brand-logo { font-size: 28px; font-weight: bold; color: var(--secondary); margin-bottom: 5px; }

        .ig-follow { 
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(45deg, #E1306C, #f77737, var(--primary));
            color: white; padding: 12px 20px; border-radius: 50px; text-decoration: none; 
            font-weight: 600; font-size: 14px; margin: 15px 0 25px; width: 85%;
        }

        .section-title { font-size: 18px; font-weight: bold; color: var(--secondary); margin: 25px 0 15px; text-transform: uppercase; border-bottom: 1px solid var(--primary); display: inline-block; }

        input, textarea, select { 
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; 
            margin: 8px 0 15px; box-sizing: border-box; font-family: inherit; font-size: 14px;
        }

        label { display: block; text-align: left; font-weight: bold; font-size: 13px; color: #6d4c41; margin-left: 5px; }

        .stars { display: flex; justify-content: center; font-size: 45px; color: #e0e0e0; cursor: pointer; margin: 10px 0; }
        .star.active { color: var(--primary); text-shadow: 0 0 10px rgba(212, 163, 115, 0.3); }

        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .chip { background: #fffaf0; padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid #fce4ec; }
        
        .submit-btn { 
            background: var(--text-dark); color: white; border: none; padding: 15px; 
            border-radius: 50px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; margin: 10px 0;
        }
        .submit-btn:disabled { background: #ccc; }

        .enquiry-box { background: #fffcf9; padding: 20px 15px; border-radius: 20px; border: 1px dashed var(--primary); margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i.postimg.cc/cZJsYWrb/filelogo.png" alt="3G Flora Logo" class="logo-img">
    <div class="brand-logo">3G Flora</div>
    <p style="font-style: italic; font-size: 14px; margin-top: 0;">Preserving Nature in Art</p>

    <a href="https://www.instagram.com/3g_flora?igsh=MXFnNXZkMnk2a2Juag==" target="_blank" class="ig-follow">
        📷 Follow us on Instagram
    </a>

    <form id="mainForm">
        <label>Your Name *</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        
        <label>Mobile Number / Instagram ID *</label>
        <input type="text" id="contact" placeholder="How can we reach you?" required>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div class="section-title">Share Feedback</div>
        <p style="font-size: 14px; margin-bottom: 5px;">How was your experience?</p>
        <div class="stars" id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        <div class="chip-container" id="suggestionList"></div>
        <textarea id="feedbackText" placeholder="Your feedback helps us grow..."></textarea>
        
        <button type="submit" id="submitFeedback" class="submit-btn">Submit Feedback</button>

        <div class="enquiry-box">
            <div class="section-title">New Order Enquiry</div>
            
            <label>Select Product *</label>
            <select id="enquiryProduct">
                <option value="None">-- Select a Product --</option>
                <option value="Jewellery">Jewellery</option>
                <option value="Photo Frame">Photo Frame</option>
                <option value="Clock">Clock</option>
                <option value="Preservation">Preservation</option>
                <option value="Return Gift">Return Gift</option>
                <option value="Name Plate">Name Plate</option>
                <option value="Other Customisation">Other Customisation</option>
            </select>

            <label>Specific Requirements</label>
            <textarea id="enquiryReqs" placeholder="Describe your dream piece..."></textarea>

            <label>Estimated Budget (₹)</label>
            <input type="number" id="enquiryBudget" placeholder="e.g. 1500">

            <label>Required Delivery Date</label>
            <input type="date" id="enquiryDate">

            <label>Need sample reference images?</label>
            <select id="enquiryRef">
                <option value="Yes">Yes, please send samples</option>
                <option value="No">No, I have my own idea</option>
            </select>

            <button type="button" id="submitEnquiry" class="submit-btn" style="background: var(--secondary);">Send Enquiry</button>
        </div>
    </form>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbz8xO_ucuKjITosMVE62XvjnxqofwLyA7mfNEQOiqQd7BPPtU-HRSOzRDPJp-SCIGxEPQ/exec";
    let selectedRating = 0;

    // Star Rating Logic
    document.querySelectorAll('.star').forEach(star => {
        star.onclick = () => {
            selectedRating = star.dataset.value;
            document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < selectedRating));
            
            const list = document.getElementById('suggestionList');
            list.innerHTML = '';
            const hints = selectedRating > 3 
                ? ["Love the preservation!", "Perfect quality", "Exquisite work!"] 
                : ["Late delivery", "Finishing issues", "More bubbles than expected"];
            
            hints.forEach(h => {
                const c = document.createElement('div'); c.className='chip'; c.innerText=h;
                c.onclick = () => document.getElementById('feedbackText').value = h;
                list.appendChild(c);
            });
        };
    });

    // Handle Feedback Submit
    document.getElementById('submitFeedback').onclick = (e) => {
        e.preventDefault();
        sendData("Feedback");
    };

    // Handle Enquiry Submit
    document.getElementById('submitEnquiry').onclick = (e) => {
        const prod = document.getElementById('enquiryProduct').value;
        if(prod === "None") { alert("Please select a product for enquiry."); return; }
        sendData("Enquiry");
    };

    function sendData(type) {
        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value;
        if(!name || !contact) { alert("Please enter Name and Contact details first."); return; }

        const btn = type === "Feedback" ? document.getElementById('submitFeedback') : document.getElementById('submitEnquiry');
        btn.disabled = true;
        btn.innerText = "Sending...";

        const formData = new FormData();
        formData.append("FormType", type);
        formData.append("Timestamp", new Date().toLocaleString());
        formData.append("Name", name);
        formData.append("Contact", contact);
        
        // Enquiry Fields
        formData.append("Product", document.getElementById('enquiryProduct').value);
        formData.append("Requirements", document.getElementById('enquiryReqs').value);
        formData.append("Budget", document.getElementById('enquiryBudget').value);
        formData.append("DeliveryDate", document.getElementById('enquiryDate').value);
        formData.append("NeedsRef", document.getElementById('enquiryRef').value);
        
        // Feedback Fields
        formData.append("Rating", selectedRating);
        formData.append("Feedback", document.getElementById('feedbackText').value);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(() => {
                alert("Thank you! Your " + type + " has been sent successfully. 🌸");
                location.reload();
            })
            .catch(() => {
                alert("Something went wrong. Please check your internet.");
                btn.disabled = false;
                btn.innerText = "Submit";
            });
    }
</script>

</body>
</html>
